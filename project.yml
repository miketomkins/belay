# xcodegen project spec — Belay (native SwiftUI)
# Generate with: xcodegen generate
# Then open Belay.xcodeproj in Xcode

name: Belay
options:
  bundleIdPrefix: com.milim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    DEVELOPMENT_TEAM: EYF346PHUG
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "0.1.15"
    CURRENT_PROJECT_VERSION: "162"
packages:
  # GPT-Live voice runs over WebRTC; Apple ships no WebRTC stack. Prebuilt
  # Google WebRTC as a binary xcframework, pinned to an exact release.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
# Each shipped target that calls a required-reason API keeps its
# PrivacyInfo.xcprivacy at its folder's root; xcodegen bundles it with that
# folder's sources (BelayTests/PrivacyManifestTests.swift checks them).
targets:
  Belay:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Belay
        excludes:
          - "Resources/AlternateIcons/**"
      - path: Belay/Resources/AlternateIcons
        buildPhase: resources
      # End-to-end encrypted notifications (#431), shared with the
      # Notification Service Extension. Also the Apple Watch app's link
      # format and relay wires (Shared/WatchVoice,
      # designs/apple-watch-voice-direct.md) and Gemini Live's protocol and
      # session (Shared/GeminiLive, designs/apple-watch-voice-direct.md),
      # shared with the Watch app.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.tomkins.belay
        PRODUCT_NAME: Belay
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Belay/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_ENTITLEMENTS: Belay/Belay.entitlements
        # Regenerated with HealthKit and the Location Push Service Extension
        # capability (com.apple.developer.location.push).
        PROVISIONING_PROFILE_SPECIFIER: "Hermes Belay App Store"
        # The draft-stripping phase below deletes lprojs it can't declare
        # up front, which the user-script sandbox would refuse.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: WebRTC
      - target: BelayWatch
      # Embedded as Belay.app/PlugIns/BelayNotificationService.appex.
      - target: BelayNotificationService
      # The configured launcher widgets are embedded with the app.
      - target: BelayWidgets
      # Answers the agent's on-demand locate while Belay isn't running
      # (designs/location-awareness.md section 12).
      - target: BelayLocationPush
    postBuildScripts:
      # A draft language (Info.plist BelayDraftLanguages) is compiled from
      # the String Catalogs like any other; drop its lproj so it never ships.
      - name: Strip draft localizations
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/scripts/strip-draft-localizations.py" \
            --info-plist "$SRCROOT/$INFOPLIST_FILE" \
            --bundle "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --development-language "$DEVELOPMENT_LANGUAGE"
  # The Apple Watch app: voice calls to Hermes, Gemini Live on the Watch
  # itself or GPT-Live through the host's audio bridge
  # (designs/apple-watch-voice-direct.md, apple-watch-gpt-live.md).
  # Embedded in the iPhone app; signed automatically so Xcode registers
  # its App ID on the first archive.
  BelayWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: BelayWatch
        # The widget extension's own code (BelayWatchWidgets).
        excludes:
          - "Widgets/**"
      - path: Shared/WatchVoice
      # The iPhone's own Gemini Live code: the Watch runs the same session
      # (designs/apple-watch-voice-direct.md).
      - path: Shared/GeminiLive
      # The iPhone's Grok Live session, which a Watch call to Grok runs
      # through the host's audio bridge.
      - path: Shared/GrokLive
      # The iPhone's Local Live session, which a Watch call to the user's
      # own speech server runs through the host's audio bridge.
      - path: Shared/LocalLive
      # GPT-Live's events, which the Watch reads and answers through the
      # host's audio bridge (designs/apple-watch-gpt-live.md).
      - path: Belay/Voice/GPTLive/GPTLiveProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.tomkins.belay.watchkitapp
        PRODUCT_NAME: BelayWatch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BelayWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Push Notifications, for the PushKit token calls from Hermes ring
        # on (designs/hermes-calls-watch.md). Automatic signing adds the
        # capability to the App ID. Production, as the iPhone's: the relay
        # sends only to production APNs.
        CODE_SIGN_ENTITLEMENTS: BelayWatch/BelayWatch.entitlements
    dependencies:
      # Embedded as BelayWatch.app/PlugIns/BelayWatchWidgets.appex.
      - target: BelayWatchWidgets
  # The Watch's complication and its control for the Action button,
  # Control Center and the Smart Stack: both start a call
  # (BelayWatch/TalkToHermesIntent.swift). watchOS 26, where Watch apps
  # first get controls. Signed automatically, as the Watch app.
  BelayWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: BelayWatch/Widgets
        excludes:
          - "Info.plist"
      # The control's intent runs in the app, so both build it.
      - path: BelayWatch/TalkToHermesIntent.swift
      - path: BelayWatch/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.tomkins.belay.watchkitapp.widgets
        PRODUCT_NAME: BelayWatchWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BelayWatch/Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
  BelayNotificationService:
    # Decrypts end-to-end encrypted notifications before iOS shows them
    # (#431). APNs still targets live.tomkins.belay; this App ID has no Push
    # capability of its own.
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BelayNotificationService
      - path: Shared
        # The Watch app's code, Gemini Live, Grok Live, Local Live and
        # location sharing, which the extension never uses.
        excludes:
          - "WatchVoice/**"
          - "GeminiLive/**"
          - "GrokLive/**"
          - "LocalLive/**"
          - "Widgets/**"
          - "Location/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.tomkins.belay.NotificationService
        PRODUCT_NAME: BelayNotificationService
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BelayNotificationService/Info.plist
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_ENTITLEMENTS: BelayNotificationService/BelayNotificationService.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Belay Notification Service App Store"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BelayLocationPush:
    # The Location Push Service Extension: iOS launches it for a `location`
    # push (the agent's on-demand locate) and it posts one sealed fix
    # straight to the Hermes host. Reads the sharing binding, the device key
    # and the host pass the app keeps in the App Group (Shared/Location).
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BelayLocationPush
      - path: Shared
        excludes:
          - "WatchVoice/**"
          - "GeminiLive/**"
          - "GrokLive/**"
          - "LocalLive/**"
          - "Widgets/**"
    # Maps lookups the host asks this iPhone for run on MapKit
    # (Shared/Location/MapsEngine.swift, designs/maps-v1-contract.md).
    dependencies:
      - sdk: MapKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.tomkins.belay.LocationPush
        PRODUCT_NAME: BelayLocationPush
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BelayLocationPush/Info.plist
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_ENTITLEMENTS: BelayLocationPush/BelayLocationPush.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Belay Location Push App Store"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BelayWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BelayWidgets
        excludes:
          - "Info.plist"
          - "BelayWidgets.entitlements"
          - "Resources/**"
      - path: BelayWidgets/Resources/Assets.xcassets
        buildPhase: resources
      - path: Shared/Widgets
      - path: Belay/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.tomkins.belay.widgets
        PRODUCT_NAME: BelayWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BelayWidgets/Info.plist
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_ENTITLEMENTS: BelayWidgets/BelayWidgets.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Belay Widgets App Store"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Strip draft localizations
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/scripts/strip-draft-localizations.py" \
            --info-plist "$SRCROOT/$INFOPLIST_FILE" \
            --bundle "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --development-language "$DEVELOPMENT_LANGUAGE"
  BelayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BelayTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Belay
  BelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BelayUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Belay
  # App Store screenshots against the demo dashboard; run only by
  # .github/workflows/app-store-screenshots.yml (skips without BELAY_DEMO_URL).
  BelayScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BelayScreenshots
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Belay
